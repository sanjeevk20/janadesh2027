<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Janadesh 2027</title>
    <meta name="description" content="Constituency-level map of the 2027 Indian state assembly elections." />
  </head>
  <body>
    <header class="topbar">
      <h1>Janadesh 2027</h1>
      <p>Assembly elections in 7 states · ~940 constituencies</p>
    </header>
    <main class="layout">
      <aside class="panel" id="panel">
        <section id="state-list" aria-label="States"></section>
        <section id="detail" aria-live="polite"></section>
      </aside>
      <div class="map-wrap">
        <div id="map"></div>
        <div class="controls">
          <div class="segmented" role="radiogroup" aria-label="Colour constituencies by" id="color-mode">
            <button role="radio" data-mode="winner" aria-checked="true">2022 winner</button>
            <button role="radio" data-mode="margin" aria-checked="false">2022 margin</button>
            <button role="radio" data-mode="ls2024" aria-checked="false">2024 Lok Sabha</button>
            <button role="radio" data-mode="swing" aria-checked="false">NDA swing</button>
            <button role="radio" data-mode="state" aria-checked="false">State</button>
          </div>
          <label class="toggle">
            <input type="checkbox" id="toggle-issues" checked />
            Highlight data issues
          </label>
        </div>
        <div class="legend" id="legend"></div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
